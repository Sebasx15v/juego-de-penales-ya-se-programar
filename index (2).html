<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penales ⚽</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">
<link rel="icon" href="icon-192.png">
<style>
  body { margin:0; background:#111; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
  canvas { background:#2e7d32; max-width:98vw; cursor:crosshair; touch-action:none; border:3px solid #fff; }
  p { margin:8px; text-align:center; }
</style>
</head>
<body>
<canvas id="c" width="800" height="500"></canvas>
<p>Mouse o flechas para apuntar · Click o Espacio para patear · R menú · M sonido</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const GOAL = {x1:200, x2:600, y1:70, y2:220};
const SPOT = {x:400, y:440};
const ROUNDS = 5;
let aim = {x:400, y:140};
let power = 0, powerDir = 1;
let state = 'menu', mode = 1, round, cur, players, ball, keeper, msg, msgTimer, shot;

/* ---------- Datos guardados ---------- */
const KEY = 'penales-v3';
let data = { best: 0, wins: {}, names: ['Jugador 1', 'Jugador 2'] };
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved) data = Object.assign(data, saved);
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

/* ---------- Sonidos ---------- */
let actx = null, muted = false;
function audio() {
  if (muted) return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, delay, slideTo) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol || 0.2, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur);
}
function noise(dur, vol, delay) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + (delay || 0);
  const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(a.destination); s.start(t0);
}
const sKick  = () => { tone(180, 0.12, 'sine', 0.35, 0, 60); noise(0.06, 0.25); };
const sGoal  = () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.25, i * 0.09)); noise(0.8, 0.12, 0.1); };
const sSave  = () => { tone(130, 0.25, 'sawtooth', 0.2, 0, 70); noise(0.1, 0.2); };
const sMiss  = () => tone(420, 0.45, 'sine', 0.25, 0, 130);
const sWhistle = () => { tone(1900, 0.18, 'square', 0.08); tone(1900, 0.3, 'square', 0.08, 0.22); };
const sWin   = () => { [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.25, i * 0.14)); };

/* ---------- Juego ---------- */
function cleanName(n, def) {
  n = (n || '').trim().slice(0, 12);
  return n || def;
}
function startGame(m) {
  mode = m;
  if (m === 2) {
    const n1 = cleanName(prompt('Nombre del Jugador 1:', data.names[0]), 'Jugador 1');
    let n2 = cleanName(prompt('Nombre del Jugador 2:', data.names[1]), 'Jugador 2');
    if (n2.toLowerCase() === n1.toLowerCase()) n2 = n2 + ' 2';
    data.names = [n1, n2]; save();
  } else {
    data.names[0] = data.names[0] || 'Jugador 1';
  }
  round = 0; cur = 0;
  players = [{goals:0, results:[]}, {goals:0, results:[]}];
  sWhistle();
  newShot();
}
function newShot() {
  state = 'aim';
  ball = {x:SPOT.x, y:SPOT.y, s:1};
  keeper = {x:400, tx:400};
  msg = ''; shot = null;
}
function toMenu() { state = 'menu'; }

function finish() {
  state = 'end';
  if (mode === 1) {
    if (players[0].goals > data.best) data.best = players[0].goals;
    if (players[0].goals >= 4) sWin();
  } else {
    const w = players[0].goals > players[1].goals ? 0 : 1;
    const name = data.names[w];
    data.wins[name] = (data.wins[name] || 0) + 1;
    sWin();
  }
  save();
}

function kick() {
  if (state !== 'aim') return;
  state = 'shot';
  sKick();
  let tx = aim.x + (Math.random()-0.5)*20;
  let ty = aim.y + (Math.random()-0.5)*20;
  const weak = power < 22, high = power > 90;
  if (high) ty -= 120;
  const kx = [300, 400, 500][Math.floor(Math.random()*3)];
  const onTarget = tx > GOAL.x1 && tx < GOAL.x2 && ty > GOAL.y1 && ty < GOAL.y2;
  let result;
  if (!onTarget) result = high ? '¡Se fue por arriba!' : '¡Afuera!';
  else if (weak || Math.abs(tx - kx) < 65) result = '¡Atajado!';
  else result = '¡GOOOL!';
  shot = {tx, ty, result, t:0, dur: weak ? 60 : 28};
  keeper.tx = kx;
}

function afterShot() {
  if (mode === 1) {
    round++;
    if (round >= ROUNDS) finish(); else newShot();
    return;
  }
  if (cur === 0) { cur = 1; newShot(); return; }
  cur = 0; round++;
  if (round >= ROUNDS && players[0].goals !== players[1].goals) finish();
  else newShot();
}

function update() {
  if (state === 'aim') {
    power += powerDir * 2.2;
    if (power >= 100) { power = 100; powerDir = -1; }
    if (power <= 0) { power = 0; powerDir = 1; }
  }
  if (state === 'shot') {
    shot.t++;
    const k = Math.min(1, shot.t / shot.dur);
    ball.x = SPOT.x + (shot.tx - SPOT.x) * k;
    ball.y = SPOT.y + (shot.ty - SPOT.y) * k - Math.sin(k*Math.PI) * 25;
    ball.s = 1 - 0.6 * k;
    keeper.x += (keeper.tx - keeper.x) * 0.12;
    if (k >= 1) {
      state = 'result';
      msg = shot.result; msgTimer = 90;
      const g = shot.result === '¡GOOOL!';
      if (g) { players[cur].goals++; sGoal(); }
      else if (shot.result === '¡Atajado!') sSave();
      else sMiss();
      players[cur].results.push(g);
    }
  }
  if (state === 'result') {
    keeper.x += (keeper.tx - keeper.x) * 0.12;
    if (--msgTimer <= 0) afterShot();
  }
}

/* ---------- Dibujo ---------- */
function drawGoal() {
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(GOAL.x1, GOAL.y1, GOAL.x2-GOAL.x1, GOAL.y2-GOAL.y1);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
  for (let x = GOAL.x1; x <= GOAL.x2; x += 20) { ctx.beginPath(); ctx.moveTo(x, GOAL.y1); ctx.lineTo(x, GOAL.y2); ctx.stroke(); }
  for (let y = GOAL.y1; y <= GOAL.y2; y += 20) { ctx.beginPath(); ctx.moveTo(GOAL.x1, y); ctx.lineTo(GOAL.x2, y); ctx.stroke(); }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(GOAL.x1, GOAL.y2); ctx.lineTo(GOAL.x1, GOAL.y1); ctx.lineTo(GOAL.x2, GOAL.y1); ctx.lineTo(GOAL.x2, GOAL.y2); ctx.stroke();
}
function drawKeeper() {
  const x = keeper.x, y = GOAL.y2 - 10;
  ctx.save(); ctx.translate(x, y); ctx.rotate((x - 400) / 100 * 0.4);
  ctx.fillStyle = '#ffeb3b'; ctx.fillRect(-18, -70, 36, 60);
  ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(0, -82, 13, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffeb3b'; ctx.fillRect(-52, -68, 34, 10); ctx.fillRect(18, -68, 34, 10);
  ctx.fillStyle = '#222'; ctx.fillRect(-16, -10, 12, 34); ctx.fillRect(4, -10, 12, 34);
  ctx.restore();
}
function drawBall() {
  const r = 18 * ball.s;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(ball.x, SPOT.y + 14, r, r*0.35, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(ball.x, ball.y, r*0.35, 0, 7); ctx.fill();
}
function dots(list, y, x0) {
  const n = Math.max(ROUNDS, list.length);
  for (let i = 0; i < n; i++) {
    ctx.beginPath(); ctx.arc(x0 + i*24, y, 8, 0, 7);
    ctx.fillStyle = i < list.length ? (list[i] ? '#4caf50' : '#f44336') : '#fff4'; ctx.fill();
  }
}
function drawField() {
  ctx.fillStyle = '#2e7d32'; ctx.fillRect(0,0,800,500);
  ctx.fillStyle = '#388e3c';
  for (let i=0;i<8;i+=2) ctx.fillRect(0, i*62, 800, 62);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 3;
  ctx.strokeRect(120, 40, 560, 300);
}
function drawMenu() {
  ctx.fillStyle = '#000b'; ctx.fillRect(0,0,800,500);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 52px sans-serif'; ctx.fillText('⚽ Penales', 400, 90);
  ctx.fillStyle = '#4caf50'; ctx.fillRect(100, 130, 280, 120);
  ctx.fillStyle = '#2196f3'; ctx.fillRect(420, 130, 280, 120);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 30px sans-serif';
  ctx.fillText('1 jugador', 240, 185); ctx.fillText('2 jugadores', 560, 185);
  ctx.font = '20px sans-serif';
  ctx.fillText('Tecla 1 o click', 240, 222); ctx.fillText('Tecla 2 o click', 560, 222);
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText('🏅 Récords', 400, 305);
  ctx.font = '20px sans-serif';
  ctx.fillText('Mejor en 1 jugador: ' + data.best + '/' + ROUNDS, 400, 340);
  const top = Object.entries(data.wins).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if (top.length) {
    ctx.fillText('Victorias: ' + top.map(([n, w]) => n + ' ' + w).join('  ·  '), 400, 372);
  } else {
    ctx.fillText('Todavía no hay victorias en 2 jugadores', 400, 372);
  }
  ctx.font = '16px sans-serif'; ctx.fillStyle = '#ccc';
  ctx.fillText('Los récords se guardan en esta compu', 400, 420);
}
function draw() {
  drawField();
  if (state === 'menu') { drawMenu(); drawMute(); return; }
  drawGoal(); drawKeeper(); drawBall();
  if (state === 'aim') {
    ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(aim.x, aim.y, 16, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(aim.x-24, aim.y); ctx.lineTo(aim.x+24, aim.y); ctx.moveTo(aim.x, aim.y-24); ctx.lineTo(aim.x, aim.y+24); ctx.stroke();
  }
  ctx.fillStyle = '#000a'; ctx.fillRect(20, 150, 24, 220);
  ctx.fillStyle = power > 90 ? '#f44336' : power < 22 ? '#ff9800' : '#4caf50';
  ctx.fillRect(22, 368 - power*2.16, 20, power*2.16);
  ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Fuerza', 32, 142);
  ctx.textAlign = 'left'; ctx.font = '20px sans-serif'; ctx.fillStyle = '#fff';
  if (mode === 1) {
    ctx.fillText('Goles: ' + players[0].goals + '   Tiro ' + Math.min(round+1, ROUNDS) + '/' + ROUNDS, 20, 30);
    dots(players[0].results, 25, 600);
  } else {
    ctx.fillText(data.names[0] + ' ' + players[0].goals + ' - ' + players[1].goals + ' ' + data.names[1], 20, 30);
    ctx.fillStyle = cur === 0 ? '#8bc34a' : '#64b5f6';
    ctx.fillText('Turno: ' + data.names[cur] + (round >= ROUNDS ? ' (muerte súbita)' : ''), 20, 58);
    ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif';
    ctx.fillText(data.names[0].slice(0, 4), 548, 30); dots(players[0].results, 25, 600);
    ctx.fillText(data.names[1].slice(0, 4), 548, 56); dots(players[1].results, 51, 600);
  }
  ctx.textAlign = 'center';
  if (state === 'result') {
    ctx.font = 'bold 56px sans-serif'; ctx.fillStyle = '#000'; ctx.fillText(msg, 402, 322);
    ctx.fillStyle = msg === '¡GOOOL!' ? '#ffeb3b' : '#fff'; ctx.fillText(msg, 400, 320);
  }
  if (state === 'end') {
    ctx.fillStyle = '#000c'; ctx.fillRect(0,0,800,500);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 42px sans-serif';
    let t;
    if (mode === 1) { const g = players[0].goals; t = g >= 4 ? '🏆 ¡Crack! ' + g + '/' + ROUNDS : g >= 2 ? '¡Bien! ' + g + '/' + ROUNDS : 'Seguí practicando: ' + g + '/' + ROUNDS; }
    else t = '🏆 ¡Ganó ' + data.names[players[0].goals > players[1].goals ? 0 : 1] + '!';
    ctx.fillText(t, 400, 205);
    ctx.font = '30px sans-serif';
    if (mode === 2) {
      ctx.fillText(players[0].goals + ' - ' + players[1].goals, 400, 250);
      const w = data.names[players[0].goals > players[1].goals ? 0 : 1];
      ctx.font = '20px sans-serif'; ctx.fillText(w + ' lleva ' + data.wins[w] + ' victoria(s) en total', 400, 285);
    } else {
      ctx.font = '20px sans-serif'; ctx.fillText('Tu récord: ' + data.best + '/' + ROUNDS, 400, 250);
    }
    ctx.font = '22px sans-serif'; ctx.fillText('Click o Espacio para volver al menú', 400, 335);
  }
  drawMute();
}
function drawMute() {
  ctx.textAlign = 'right'; ctx.font = '18px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(muted ? '🔇 M' : '🔊 M', 785, 490);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

/* ---------- Controles ---------- */
function setAim(e) {
  const r = cv.getBoundingClientRect();
  aim.x = Math.max(120, Math.min(680, (e.clientX - r.left) * 800 / r.width));
  aim.y = Math.max(40, Math.min(300, (e.clientY - r.top) * 500 / r.height));
}
cv.addEventListener('pointermove', setAim);
cv.addEventListener('pointerdown', e => {
  setAim(e);
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left) * 800 / r.width;
  if (state === 'menu') startGame(px < 400 ? 1 : 2);
  else if (state === 'end') toMenu();
  else kick();
});
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const step = 14;
  if (k === 'm') { muted = !muted; return; }
  if (state === 'menu') {
    if (k === '1') startGame(1); else if (k === '2') startGame(2);
    return;
  }
  if (k === 'arrowleft' || k === 'a') aim.x = Math.max(120, aim.x - step);
  else if (k === 'arrowright' || k === 'd') aim.x = Math.min(680, aim.x + step);
  else if (k === 'arrowup' || k === 'w') aim.y = Math.max(40, aim.y - step);
  else if (k === 'arrowdown' || k === 's') aim.y = Math.min(300, aim.y + step);
  else if (k === ' ' || k === 'enter') { if (state === 'end') toMenu(); else kick(); }
  else if (k === 'r') toMenu();
  if (k.startsWith('arrow') || k === ' ') e.preventDefault();
});

loop();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
